body {

/* LITTLE HAMZA SCENE */

.scene {
    height: 250px;
    margin: 22px 0;
    background: #fffafd;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
}

/* HAMZA */

.hamza {
    position: absolute;
    left: 28%;
    bottom: 25px;
    width: 90px;
    height: 190px;
}

/* curly hair */

.hair {
    position: absolute;
    top: 3px;
    left: 10px;
    width: 68px;
    height: 45px;
    background: #3b2929;
    border-radius: 45% 45% 35% 35%;
}

.curl {
    position: absolute;
    width: 17px;
    height: 17px;
    background: #3b2929;
    border-radius: 50%;
}
