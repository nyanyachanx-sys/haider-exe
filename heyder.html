<!DOCTYPE html>
<html>
<head>
<title>HAIDER.EXE ♡</title>
<style>
* {
    box-sizing: border-box;
}
body {
    background: #fff7fb;
    color: #4b3945;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}
.card {
    width: 95%;
    max-width: 650px;
    background: white;
    border: 2px solid #e9b8d0;
    border-radius: 22px;
    padding: 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(180,120,150,0.15);
}
h1 {
    color: #c879a0;
    letter-spacing: 4px;
    margin-bottom: 5px;
}
.subtitle {
    color: #9b7b8b;
    margin-bottom: 20px;
}
/* ---------------- HAIDER SCENE ---------------- */
.scene {
    height: 260px;
    position: relative;
    margin: 10px auto 20px;
    overflow: hidden;
    background: #fff9fc;
    border-radius: 18px;
}
/* tiny Haider */
.haider {
    position: absolute;
    left: 43%;
    bottom: 25px;
    width: 110px;
    height: 190px;
}
/* FACE */
.head {
    position: absolute;
    width: 82px;
    height: 82px;
    background: #b97855;
    border-radius: 45% 45% 42% 42%;
    top: 25px;
    left: 14px;
    z-index: 2;
}
/* HAIR */
.hair {
    position: absolute;
    width: 88px;
    height: 45px;
    background: #3d2b2b;
    border-radius: 50% 50% 35% 35%;
    top: 18px;
    left: 11px;
    z-index: 4;
    pointer-events: none;
}
/* little hair piece */
.hair:after {
    content: "";
    position: absolute;
    width: 25px;
    height: 30px;
    background: #3d2b2b;
    left: 8px;
    top: 22px;
    transform: rotate(15deg);
    border-radius: 50%;
}
/* EYES */
.eye {
    position: absolute;
    width: 7px;
    height: 9px;
    background: #302326;
    border-radius: 50%;
    top: 58px;
    z-index: 5;
}
.eye.left {
    left: 34px;
}
.eye.right {
    right: 34px;
}
/* eyebrows */
.brow {
    position: absolute;
    width: 14px;
    height: 3px;
    background: #3d2b2b;
    top: 51px;
    z-index: 5;
    border-radius: 5px;
}
.brow.left {
    left: 30px;
    transform: rotate(-5deg);
}
.brow.right {
    right: 30px;
    transform: rotate(5deg);
}
/* NOSE */
.nose {
    position: absolute;
    width: 5px;
    height: 8px;
    border-right: 2px solid #91583f;
    border-bottom: 2px solid #91583f;
    top: 66px;
    left: 39px;
    transform: rotate(20deg);
    z-index: 5;
}
/* SMILE */
.smile {
    position: absolute;
    width: 24px;
    height: 12px;
    border-bottom: 3px solid #703f45;
    border-radius: 50%;
    left: 29px;
    top: 76px;
    z-index: 5;
}
/* BODY */
.body {
    position: absolute;
    width: 75px;
    height: 70px;
    background: #9c7bb5;
    border-radius: 18px 18px 8px 8px;
    left: 18px;
    top: 105px;
    z-index: 1;
}
/* ARMS */
.arm {
    position: absolute;
    width: 18px;
    height: 55px;
    background: #b97855;
    border-radius: 15px;
    top: 110px;
    z-index: 1;
}
.arm.left {
    left: 5px;
    transform: rotate(18deg);
}
.arm.right {
    right: 5px;
    transform: rotate(-18deg);
}
/* HAND HOLDING FLOWER */
.hand {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #b97855;
    border-radius: 50%;
    right: -2px;
    top: 148px;
    z-index: 3;
}
/* LEGS */
.leg {
    position: absolute;
    width: 20px;
    height: 35px;
    background: #4d4357;
    top: 165px;
    border-radius: 0 0 10px 10px;
    z-index: 1;
}
.leg.left {
    left: 30px;
}
.leg.right {
    right: 30px;
}
/* ---------------- FLOWER ---------------- */
.flower {
    position: absolute;
    left: 54%;
    bottom: 32px;
    width: 70px;
    height: 130px;
    cursor: pointer;
    transition: transform 0.3s;
}
.flower:hover {
    transform: scale(1.08);
}
.stem {
    position: absolute;
    width: 6px;
    height: 85px;
    background: #77a879;
    bottom: 0;
    left: 32px;
    border-radius: 5px;
}
.leaf {
    position: absolute;
    width: 28px;
    height: 14px;
    background: #91bd91;
    border-radius: 100% 0 100% 0;
    bottom: 38px;
    left: 5px;
    transform: rotate(20deg);
}
.petals {
    position: absolute;
    top: 8px;
    left: 13px;
    width: 45px;
    height: 45px;
    animation: float 2s ease-in-out infinite;
}
.petal {
    position: absolute;
    width: 25px;
    height: 25px;
    background: #f3a7c6;
    border-radius: 50%;
}
.p1 {
    top: 0;
    left: 10px;
}
.p2 {
    top: 10px;
    left: 0;
}
.p3 {
    top: 10px;
    right: 0;
}
.p4 {
    bottom: 0;
    left: 10px;
}
.center {
    position: absolute;
    width: 17px;
    height: 17px;
    background: #f4c96b;
    border-radius: 50%;
    top: 14px;
    left: 14px;
    z-index: 2;
}
@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-6px);
    }
}
/* ---------------- TEXT ---------------- */
.line {
    margin: 10px 0;
}
button {
    background: white;
    color: #b86591;
    border: 1.5px solid #d88caf;
    border-radius: 12px;
    padding: 10px 18px;
    font-family: monospace;
    cursor: pointer;
    margin: 7px;
}
button:hover {
    background: #fff0f6;
    transform: translateY(-1px);
}
#result {
    margin-top: 20px;
    line-height: 1.8;
}
.big {
    font-size: 20px;
    color: #bd6c96;
}
.heart {
    color: #ed86ad;
}
.hint {
    font-size: 12px;
    color: #a9909e;
    margin-top: 8px;
}
/* ---------------- FLOATING HEARTS ---------------- */
.heart-float {
    position: fixed;
    bottom: 0;
    font-size: 20px;
    animation: rise 3s ease-out forwards;
    pointer-events: none;
    color: #ed86ad;
}
@keyframes rise {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-100vh);
        opacity: 0;
    }
}
</style>
</head>
<body>
<div class="card">
<h1>HAIDER.EXE</h1>
<div class="subtitle">
boyfriend day edition ♡
</div>
<!-- HAIDER -->
<div class="scene">
<div class="haider">
<div class="head">
<div class="brow left"></div>
<div class="brow right"></div>
<div class="eye left"></div>
<div class="eye right"></div>
<div class="nose"></div>
<div class="smile"></div>
</div>
<div class="hair"></div>
<div class="body"></div>
<div class="arm left"></div>
<div class="arm right"></div>
<div class="hand"></div>
<div class="leg left"></div>
<div class="leg right"></div>
</div>
<!-- FLOWER -->
<div class="flower" onclick="flowerLove()">
<div class="petals">
<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="center"></div>
</div>
<div class="stem"></div>
<div class="leaf"></div>
</div>
</div>
<div class="hint">
↑ tiny haider brought you a flower ↑
<br>
(click the flower ♡)
</div>
<br>
<div class="line">
&gt; hello haider.
</div>
<div class="line">
&gt; boyfriend detected.
</div>
<div class="line">
&gt; beginning very serious evaluation...
</div>
<button onclick="start()">
START BF DAY ♡
</button>
<div id="result"></div>
</div>
<script>
function start() {
document.getElementById("result").innerHTML = `
&gt; quick verification required.
<br><br>
<strong>
Are you Haya's boyfriend?
</strong>
<br>
<button onclick="yes()">
YES ♡
</button>
<button onclick="nope()">
NO
</button>
`;
}
function nope() {
document.getElementById("result").innerHTML = `
&gt; checking answer...
<br><br>
❌ incorrect answer.
<br>
&gt; nice try.
<br>
<button onclick="start()">
TRY AGAIN
</button>
`;
}
function yes() {
document.getElementById("result").innerHTML = `
&gt; answer accepted ♡
<br><br>
<div>✓ boyfriend detected</div>
<div>✓ Haya approved</div>
<div>✓ application accepted</div>
<br>
&gt; boyfriend privileges unlocked.
<br><br>
<div>
♡ unlimited "call me" requests
</div>
<div>
♡ random pictures
</div>
<div>
♡ listening to unnecessary stories
</div>
<div>
♡ hugs whenever requested
</div>
<div>
♡ receiving songs you may or may not listen to
</div>
<div>
♡ being loved an unreasonable amount
</div>
<br>
<button onclick="accept()">
ACCEPT PRIVILEGES
</button>
`;
}
function accept() {
document.getElementById("result").innerHTML = `
&gt; privileges accepted ♡
<br><br>
<div class="big">
HAPPY BOYFRIEND DAY
</div>
<br>
you are officially today's
<br>
most important person.
<br><br>
unfortunately...
<br>
this position is permanent.
<br>
no refunds.
<br>
no exchanges.
<br>
you're stuck with me.
<br><br>
<button onclick="fate()">
ACCEPT FATE ♡
</button>
`;
}
function fate() {
makeHearts();
document.getElementById("result").innerHTML = `
&gt; fate accepted.
<br><br>
<div class="big">
BOYFRIEND STATUS: PERMANENT ♡
</div>
<br>
&gt; updating relationship status...
<br>
✓ still my person
<br>
✓ still my favourite idiot
<br>
✓ still the one i want to tell everything to
<br>
✓ still very very loved
<br><br>
<span class="heart">
♥ happy boyfriend day, haider.
</span>
<br><br>
&gt; sending final message...
<br><br>
<span class="heart big">
"i love you, idiot."
</span>
<br><br>
&gt; okayyy bye.
<br>
&gt; actually wait.
<br>
&gt; one last thing...
<br><br>
<strong>
call me ♡
</strong>
`;
}
function flowerLove() {
makeHearts();
document.querySelector(".hint").innerHTML =
"haider.exe has successfully delivered your flower ♡";
}
function makeHearts() {
for (let i = 0; i < 25; i++) {
let heart = document.createElement("div");
heart.className = "heart-float";
heart.innerHTML = "♡";
heart.style.left =
Math.random() * 100 + "vw";
heart.style.animationDuration =
(2 + Math.random() * 2) + "s";
heart.style.fontSize =
(15 + Math.random() * 15) + "px";
document.body.appendChild(heart);
setTimeout(() => {
heart.remove();
}, 4000);
}
}
</script>
</body>
</html>
